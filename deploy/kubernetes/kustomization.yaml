# Example Kubernetes deployment of ShareLLM Server. See docs/scaling.md.
# Render with `kubectl kustomize deploy/kubernetes`, apply with `kubectl apply -k deploy/kubernetes`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sharellm
labels:
  - pairs:
      app.kubernetes.io/name: sharellm-server
      app.kubernetes.io/part-of: sharellm
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
images:
  # The image built from the Dockerfile and pushed to your registry.
  - name: sharellm-server
    newName: registry.example.org/sharellm-server
    newTag: "1.0.0"
