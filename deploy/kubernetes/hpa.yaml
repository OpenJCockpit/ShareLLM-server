apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sharellm-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sharellm-server
  # Two replicas for availability. Raising maxReplicas also raises the database
  # connection budget; see DB_POOL_SIZE in configmap.yaml.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Scale down slowly: a removed pod cuts off its waiting synchronous callers.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
