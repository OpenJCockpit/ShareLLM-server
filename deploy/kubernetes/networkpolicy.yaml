apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sharellm-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sharellm-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # API traffic only from the ingress controller. Kubelet probes are not affected.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    # PostgreSQL. Narrow this with an ipBlock or podSelector for your database.
    - ports:
        - port: 5432
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
